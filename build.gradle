plugins {
	id 'net.fabricmc.fabric-loom'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.shedaniel.me/" }
	maven { url "https://api.modrinth.com/maven" }
}

loom {
	accessWidenerPath = file("src/main/resources/progressionmod.accesswidener")

	runs {
		// Offline test client with its own game folder (run/test), separate from runClient's run/.
		testClient {
			client()
			configName = "Test Client"
			runDir = "run/test"
			programArgs "--username", "Tester"
		}
	}
}

// ./gradlew testClient            -> launch the test client
// ./gradlew testClient -Pneocraft -> same, with NeoCraft UI from libs/ loaded too
def testMods = file("run/test/mods")
tasks.matching { it.name == "runTestClient" }.configureEach {
	doFirst {
		testMods.mkdirs()
		def neocraft = file("libs/neocraft_ui-${project.neocraft_version}.jar")
		def installed = new File(testMods, neocraft.name)
		if (project.hasProperty("neocraft")) {
			if (!neocraft.exists()) throw new GradleException("NeoCraft jar not found: ${neocraft}")
			java.nio.file.Files.copy(neocraft.toPath(), installed.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
		} else {
			installed.delete()
		}
	}
}

tasks.register("testClient") {
	group = "progression"
	description = "Launches an offline Minecraft client with the mod for testing (add -Pneocraft to include NeoCraft UI)."
	dependsOn "runTestClient"
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
	implementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
	include "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
	compileOnly "maven.modrinth:jade:${project.jade_version}"
	// Not on any maven; the jar is checked into libs/. Never required at runtime.
	compileOnly files("libs/neocraft_ui-${project.neocraft_version}.jar")
}

processResources {
	def props = [
		version: project.version,
		minecraft_version_range: project.minecraft_version_range,
		loader_version: project.loader_version
	]
	inputs.properties props
	filteringCharset "UTF-8"

	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}
